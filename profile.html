<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملف طالب | Infinity University Activity</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14;--panel:#0f1420;--line:#25304a;--tx:#e8ecf5;--mu:#9aa7c2;--a:#3b82f6;--b:#8b5cf6;--g:#34d399;--gold:#fbbf24}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 500px at 50% -120px,rgba(59,130,246,.28),transparent),radial-gradient(800px 400px at 100% 0,rgba(139,92,246,.18),transparent),var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh;line-height:1.6}
.w{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}header img{width:54px;height:54px;border-radius:14px;object-fit:contain;background:#0a0e18;border:1px solid var(--line);padding:4px}
h1{font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,#93c5fd,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--mu);font-size:.9rem}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.8rem}.live i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.st{background:linear-gradient(180deg,#121a2c,var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px}.st b{display:block;font-size:1.9rem;font-weight:800;line-height:1.1}.st span{color:var(--mu);font-size:.82rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mu);font:700 14px Cairo;cursor:pointer}.tabs button.on{background:linear-gradient(135deg,#2563eb,#7c5cff);color:#fff;border-color:#60a5fa}
.g{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.card h2{font-size:1.05rem;margin-bottom:12px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;margin-bottom:14px}
.pd{text-align:center;border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:#0b1020}.pd .m{font-size:1.7rem}.pd .n{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd .x{color:var(--mu);font-size:.8rem}
.pd.p1{border-color:var(--gold);padding-top:22px;background:linear-gradient(180deg,rgba(251,191,36,.12),#0b1020)}.pd.p1 .x{color:var(--gold)}
.r{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #182036}.r:last-child{border:0}.r .k{width:28px;text-align:center;color:var(--mu);font-weight:800}.r .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .v{color:#93c5fd;font-weight:800;white-space:nowrap}.r .s{color:var(--mu);font-size:.78rem;white-space:nowrap}
.f{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #182036;font-size:.92rem}.f:last-child{border:0}.f .e{font-size:1.3rem}.f small{color:var(--mu);display:block}.f.c .t b{color:var(--g)}
.empty{color:var(--mu);text-align:center;padding:26px 8px}
.cta{margin-top:22px;text-align:center;color:var(--mu);font-size:.9rem}.cta a{color:#93c5fd}
@media(max-width:820px){.g{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:1.3rem}}

.pf{display:flex;align-items:center;gap:16px;margin-bottom:18px}.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c5cff);flex:none}.pf h1{font-size:1.5rem;overflow-wrap:anywhere}.pf p{color:var(--mu);font-size:.85rem}
.bds{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bd{text-align:center;font-size:.78rem;color:#cbd5e1;border:1px solid var(--line);border-radius:12px;padding:10px 4px;background:#0b1020}.bd b{display:block;font-size:1.8rem;font-weight:400;margin-bottom:2px}.bd.off{opacity:.3;filter:grayscale(1)}
.cr{padding:10px 4px;border-bottom:1px solid #182036}.cr:last-child{border:0}.cr .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.92rem}.cr .t span:last-child{color:#93c5fd;white-space:nowrap}.bar{height:8px;border-radius:6px;background:#1a2440;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}.bar.done i{background:var(--g)}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:16px;height:16px;border-radius:50%;background:#1f2a44}.dots i.on{background:var(--gold)}
.sh{padding:11px 18px;border-radius:12px;border:1px solid #334968;background:#17253d;color:#e8ecf5;font:700 14px Cairo;cursor:pointer}
.col{display:grid;gap:16px}
@media(max-width:820px){.bds{grid-template-columns:repeat(5,1fr);gap:6px}.bd{font-size:.62rem;padding:8px 2px}.bd b{font-size:1.3rem}.pf h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="w">
<div id="app"><div class="empty">جاري التحميل...</div></div>
<p class="cta"><a href="platforms.html">كل الأكاديميات</a> · <a href="leaderboard.html">🏆 لوحة المتصدرين</a></p>
</div>
<script>
var API='https://ttbhkelmmnhoohucewda.supabase.co/rest/v1/rpc/',KEY='sb_publishable_dtIO-b76YDbgp6RNCr_mjA_LZLdc1Z8';
var C={'sql-from-zero':['SQL','🗄️'],'python-da-from-zero':['Python للتحليل','🐍'],'stats-from-zero':['الإحصاء','📈'],'ml-from-zero':['Machine Learning','🤖'],'javascript-from-zero':['JavaScript','🟨'],'java-from-zero':['Java','☕'],'cpp-from-zero':['C++','⚙️'],'git-from-zero':['Git و GitHub','🌿'],'excel-da-from-zero':['Excel','📗'],'tableau-from-zero':['Tableau','📊'],'powerbi-from-zero':['Power BI','🟡'],'cyber-from-zero':['الأمن السيبراني','🛡️'],'html-css-from-zero':['HTML و CSS','🎨'],'flutter-from-zero':['Flutter','📱']};
var BD={first_lesson:['🌱','أول درس'],lessons_10:['📘','١٠ دروس'],lessons_50:['📚','٥٠ درس'],lessons_100:['🏅','١٠٠ درس'],explorer:['🧭','مستكشف: ٣ كورسات'],first_cert:['🎓','أول شهادة'],certs_3:['🏆','٣ شهادات'],streak_3:['🔥','٣ أيام ورا بعض'],streak_7:['⚡','أسبوع كامل'],streak_30:['👑','٣٠ يوم ورا بعض']};
var BDK=['first_lesson','lessons_10','lessons_50','lessons_100','explorer','first_cert','certs_3','streak_3','streak_7','streak_30'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
var app=document.getElementById('app'),u=(new URLSearchParams(location.search).get('u')||'').toLowerCase().trim();
function nf(){app.innerHTML='<div class="card"><div class="empty">الملف ده مش موجود، أو صاحبه مخفي اسمه.<br><a href="leaderboard.html" style="color:#93c5fd">ارجع للوحة المتصدرين</a></div></div>'}
function days7(sk){var d=new Date(sk.today+'T12:00:00Z'),h='';for(var i=6;i>=0;i--){var x=new Date(d.getTime()-i*864e5).toISOString().slice(0,10);h+='<i'+(sk.days.indexOf(x)>-1?' class="on"':'')+'></i>'}return h}
function draw(p){
 document.title=p.name+' | Infinity University Activity';
 var ea=p.badges.earned||[],sk=p.streak,j=new Date(p.joined).toLocaleDateString('ar-EG',{year:'numeric',month:'long'});
 var h='<div class="pf"><div class="av">'+esc((p.name||'?').trim().charAt(0).toUpperCase())+'</div><div><h1>'+esc(p.name)+'</h1><p>انضم '+j+'</p></div><button class="sh" id="sh" style="margin-inline-start:auto" type="button">🔗 شارك</button></div>';
 h+='<div class="stats"><div class="st"><b>'+ar(p.xp)+'</b><span>⭐ نقطة</span></div><div class="st"><b>'+ar(p.badges.lessons)+'</b><span>📘 درس</span></div><div class="st"><b>'+ar(p.badges.completed)+'</b><span>🎓 شهادة</span></div><div class="st"><b>'+ar(sk.current)+'</b><span>🔥 يوم ورا بعض</span></div></div>';
 h+='<div class="col"><div class="card"><h2>🏅 الشارات ('+ar(ea.length)+' من '+ar(BDK.length)+')</h2><div class="bds">'+BDK.map(function(k){var on=ea.indexOf(k)>-1;return '<div class="bd'+(on?'':' off')+'"><b>'+(on?BD[k][0]:'🔒')+'</b>'+BD[k][1]+'</div>'}).join('')+'</div></div>';
 h+='<div class="card"><h2>🔥 النشاط</h2><div style="color:var(--mu);font-size:.88rem">أطول سلسلة: '+ar(sk.best)+' يوم · آخر ٧ أيام:</div><div class="dots">'+days7(sk)+'</div></div>';
 h+='<div class="card"><h2>📚 الكورسات</h2>'+(p.courses.length?p.courses.map(function(c){var m=C[c.slug]||[c.slug,'📘'];return '<div class="cr"><div class="t"><span>'+m[1]+' '+esc(m[0])+(c.completed_at?' 🎓':'')+'</span><span>'+ar(c.pct)+'%</span></div><div class="bar'+(c.pct>=100?' done':'')+'"><i style="width:'+Math.max(2,Math.min(100,c.pct))+'%"></i></div></div>'}).join(''):'<div class="empty">لسه ما بدأش كورس</div>')+'</div></div>';
 app.innerHTML=h;
 document.getElementById('sh').onclick=function(){var b=this,l=location.href;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(l):Promise.reject()).then(function(){b.textContent='اتنسخ ✓'}).catch(function(){prompt('انسخ اللينك',l)})}}
if(!/^[a-z0-9_.]{3,24}$/.test(u))nf();else fetch(API+'app_profile',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_username:u})}).then(function(r){return r.json()}).then(function(p){if(!p||p.error||!p.name)nf();else draw(p)}).catch(function(){app.innerHTML='<div class="card"><div class="empty">مفيش اتصال، جرّب تاني</div></div>'});
</script>
</body>
</html>
