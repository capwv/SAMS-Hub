<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المتصدرين | Infinity University Activity</title>
<meta name="description" content="مين خلص إيه النهارده؟ لوحة المنافسة المباشرة لأكاديميات Infinity University Activity.">
<link rel="icon" href="assets/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a14;--panel:#0f1420;--line:#25304a;--tx:#e8ecf5;--mu:#9aa7c2;--a:#3b82f6;--b:#8b5cf6;--g:#34d399;--gold:#fbbf24}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 500px at 50% -120px,rgba(59,130,246,.28),transparent),radial-gradient(800px 400px at 100% 0,rgba(139,92,246,.18),transparent),var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh;line-height:1.6}
.w{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}header img{width:54px;height:54px;border-radius:14px;object-fit:contain;background:#0a0e18;border:1px solid var(--line);padding:4px}
h1{font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,#93c5fd,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--mu);font-size:.9rem}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.8rem}.live i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.st{background:linear-gradient(180deg,#121a2c,var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px}.st b{display:block;font-size:1.9rem;font-weight:800;line-height:1.1}.st span{color:var(--mu);font-size:.82rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mu);font:700 14px Cairo;cursor:pointer}.tabs button.on{background:linear-gradient(135deg,#2563eb,#7c5cff);color:#fff;border-color:#60a5fa}
.g{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.card h2{font-size:1.05rem;margin-bottom:12px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;margin-bottom:14px}
.pd{text-align:center;border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:#0b1020}.pd .m{font-size:1.7rem}.pd .n{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd .x{color:var(--mu);font-size:.8rem}
.pd.p1{border-color:var(--gold);padding-top:22px;background:linear-gradient(180deg,rgba(251,191,36,.12),#0b1020)}.pd.p1 .x{color:var(--gold)}
.r{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #182036}.r:last-child{border:0}.r .k{width:28px;text-align:center;color:var(--mu);font-weight:800}.r .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .v{color:#93c5fd;font-weight:800;white-space:nowrap}.r .s{color:var(--mu);font-size:.78rem;white-space:nowrap}
.f{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #182036;font-size:.92rem}.f:last-child{border:0}.f .e{font-size:1.3rem}.f small{color:var(--mu);display:block}.f.c .t b{color:var(--g)}
.empty{color:var(--mu);text-align:center;padding:26px 8px}
.cta{margin-top:22px;text-align:center;color:var(--mu);font-size:.9rem}.cta a{color:#93c5fd}
@media(max-width:820px){.g{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="w">
<header><img src="assets/logo.webp" alt="" onerror="this.style.display='none'"><div><h1>🏆 لوحة المتصدرين</h1><p>مين خلص إيه النهارده؟ المنافسة مباشرة من كل الأكاديميات</p></div><div class="live"><i></i><span id="up">جاري التحميل</span></div></header>
<div class="stats" id="stats"></div>
<div class="tabs"><button class="on" data-t="today">🔥 النهارده</button><button data-t="all">⭐ الأعلى نقاطًا</button></div>
<div class="g"><div class="card"><h2 id="lt">أكتر ناس اتقدموا النهارده</h2><div id="pod"></div><div id="list"></div></div>
<div class="card"><h2>⚡ آخر النشاط</h2><div id="feed"></div></div></div>
<p class="cta" id="cta"></p>
</div>
<script>
var API='https://ttbhkelmmnhoohucewda.supabase.co/rest/v1/rpc/app_leaderboard',KEY='sb_publishable_dtIO-b76YDbgp6RNCr_mjA_LZLdc1Z8';
var C={'sql-from-zero':['SQL','🗄️'],'python-da-from-zero':['Python للتحليل','🐍'],'stats-from-zero':['الإحصاء','📈'],'ml-from-zero':['Machine Learning','🤖'],'javascript-from-zero':['JavaScript','🟨'],'java-from-zero':['Java','☕'],'cpp-from-zero':['C++','⚙️'],'git-from-zero':['Git و GitHub','🌿'],'excel-da-from-zero':['Excel','📗'],'tableau-from-zero':['Tableau','📊'],'powerbi-from-zero':['Power BI','🟡'],'cyber-from-zero':['الأمن السيبراني','🛡️'],'html-css-from-zero':['HTML و CSS','🎨'],'flutter-from-zero':['Flutter','📱'],'digital-marketing-from-zero':['التسويق الرقمي','📣'],'english-from-zero':['الإنجليزي','🔤'],'ai-tools-from-zero':['أدوات الـ AI','✨'],'accounting-from-zero':['المحاسبة','🧮']};
var tab='today',D=null,HM={};
function nm(n){var u=HM[n];return u?'<a href="profile.html?u='+encodeURIComponent(u)+'" style="color:inherit;text-decoration:none">'+esc(n)+'</a>':esc(n)}
function loadH(){fetch(API.replace('app_leaderboard','app_profile_handles'),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json()}).then(function(a){var c={};HM={};if(!Array.isArray(a))return;a.forEach(function(x){c[x.name]=(c[x.name]||0)+1});a.forEach(function(x){if(c[x.name]===1)HM[x.name]=x.u});if(D)draw()}).catch(function(){})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function ago(t){var s=Math.max(0,(Date.now()-new Date(t))/1000);if(s<60)return 'دلوقتي';if(s<3600)return 'من '+ar(Math.floor(s/60))+' دقيقة';return 'من '+ar(Math.floor(s/3600))+' ساعة'}
function load(){fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'}).then(function(r){return r.json()}).then(function(d){D=d;draw();document.getElementById('up').textContent='محدّث '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}).catch(function(){document.getElementById('up').textContent='مفيش اتصال'})}
function draw(){var s=D.stats;
 document.getElementById('stats').innerHTML=[['👥',s.users,'طالب مسجّل'],['🟢',s.active_today,'نشط النهارده'],['✅',s.lessons_today,'درس اتخلص النهارده'],['🎓',s.completions_total,'كورس اتكمّل 100%']].map(function(x){return '<div class="st"><b>'+ar(x[1])+'</b><span>'+x[0]+' '+x[2]+'</span></div>'}).join('');
 var rows=tab==='today'?D.today:D.top;document.getElementById('lt').textContent=tab==='today'?'أكتر ناس اتقدموا النهارده':'الأعلى نقاطًا في كل الأكاديميات';
 var med=['🥇','🥈','🥉'],top=rows.slice(0,3),h='';
 if(top.length){var o=[top[1],top[0],top[2]],cls=['','p1',''],idx=[1,0,2];h='<div class="pod">';o.forEach(function(p,i){if(!p){h+='<div></div>';return}h+='<div class="pd '+cls[i]+'"><div class="m">'+med[idx[i]]+'</div><div class="n">'+nm(p.name)+'</div><div class="x">'+(tab==='today'?ar(p.lessons)+' درس':ar(p.xp)+' نقطة')+'</div></div>'});h+='</div>'}
 document.getElementById('pod').innerHTML=h;
 document.getElementById('list').innerHTML=rows.length?rows.map(function(p,i){return '<div class="r"><span class="k">'+ar(i+1)+'</span><span class="n">'+nm(p.name)+'</span><span class="s">'+(tab==='today'?(p.completed?'🎓 '+ar(p.completed)+' ':''):ar(p.completed)+' كورس · '+ar(p.lessons)+' درس')+'</span><span class="v">'+(tab==='today'?'+'+ar(p.lessons)+' درس':ar(p.xp)+' ⭐')+'</span></div>'}).join(''):'<div class="empty">لسه مفيش نشاط النهارده. كن أول واحد يدخل اللوحة 💪</div>';
 document.getElementById('feed').innerHTML=D.feed.length?D.feed.map(function(f){var c=C[f.slug]||[f.slug,'📘'];var done=f.type==='complete';return '<div class="f'+(done?' c':'')+'"><span class="e">'+(done?'🎓':c[1])+'</span><div class="t">'+(done?'<b>'+esc(f.name)+'</b> خلّص كورس <b>'+esc(c[0])+'</b> 100%':'<b>'+esc(f.name)+'</b> وصل '+ar(f.pct)+'% في '+esc(c[0]))+'<small>'+ago(f.at)+'</small></div></div>'}).join(''):'<div class="empty">النشاط هيظهر هنا لحظة بلحظة</div>';
 document.getElementById('cta').innerHTML='عايز اسمك يبقى هنا؟ افتح أي أكاديمية وسجّل حساب من الزرار اللي تحت. <a href="platforms.html">كل الأكاديميات</a>'}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-t');document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});if(D)draw()}});
load();loadH();setInterval(load,30000);setInterval(loadH,120000);
fetch('https://ttbhkelmmnhoohucewda.supabase.co/rest/v1/rpc/app_track',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:null,p_anon:(function(){try{var a=localStorage.getItem('iua-anon');if(!a){a=Math.random().toString(36).slice(2);localStorage.setItem('iua-anon',a)}return a}catch(e){return'x'}})(),p_events:[{type:'leaderboard',slug:'leaderboard'}]})}).catch(function(){});
</script>
</body>
</html>
